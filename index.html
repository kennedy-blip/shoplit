<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kibo Goods — Modern Lifestyle &amp; Craft Store</title>
  <style>
    :root {
      --bg: #faf9f6;
      --surface: #ffffff;
      --text: #1c1b18;
      --muted: #6b6860;
      --accent: #2c5e4f;
      --accent-hover: #21473b;
      --border: #e6e2d8;
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(250, 249, 246, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
    }

    .nav-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--accent);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 500;
    }

    .cart-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: background 0.2s;
    }

    .cart-btn:hover {
      background: var(--accent-hover);
    }

    .hero {
      max-width: 1140px;
      margin: 2.5rem auto;
      padding: 3.5rem 2rem;
      background: linear-gradient(135deg, #2c5e4f 0%, #1d3f35 100%);
      color: #fff;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .hero h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      max-width: 620px;
    }

    .hero p {
      max-width: 520px;
      color: #dce8e4;
      font-size: 1.05rem;
    }

    .hero .cta {
      display: inline-block;
      margin-top: 0.5rem;
      background: #fff;
      color: var(--accent);
      padding: 0.75rem 1.4rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      width: fit-content;
    }

    main {
      max-width: 1140px;
      margin: 0 auto 4rem;
      padding: 0 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.75rem;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .filter-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
      color: var(--text);
      transition: all 0.2s;
    }

    .filter-btn.active,
    .filter-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .search-input {
      padding: 0.55rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      min-width: 240px;
      background: var(--surface);
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.06);
    }

    .card-thumb {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      background: #f2efe9;
    }

    .card-body {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 0.5rem;
    }

    .card-category {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      font-weight: 600;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .card-desc {
      font-size: 0.9rem;
      color: var(--muted);
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }

    .price {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .add-btn {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--accent);
    }

    /* Cart Drawer */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      display: none;
      justify-content: flex-end;
      z-index: 200;
    }

    .drawer-backdrop.open {
      display: flex;
    }

    .drawer {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      height: 100%;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--muted);
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .drawer-footer {
      border-top: 1px solid var(--border);
      padding-top: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      font-size: 1.15rem;
      font-weight: 700;
    }

    .checkout-btn {
      width: 100%;
      padding: 0.85rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .checkout-btn:hover {
      background: var(--accent-hover);
    }

    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="#" class="logo">Kibo Goods</a>
      <nav class="nav-links">
        <a href="#catalog">Shop</a>
        <a href="#about">About</a>
        <button class="cart-btn" id="openCartBtn" aria-label="Open shopping cart">
          Cart (<span id="cartCount">0</span>)
        </button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <h1>Everyday Objects Built to Last</h1>
    <p>Curated essentials for your desk, kitchen, and daily commute. Sustainably sourced and thoughtfully crafted.</p>
    <a href="#catalog" class="cta">Explore Collection</a>
  </section>

  <main id="catalog">
    <div class="toolbar">
      <div class="filters" id="categoryFilters">
        <button class="filter-btn active" data-category="all">All</button>
        <button class="filter-btn" data-category="Workspace">Workspace</button>
        <button class="filter-btn" data-category="Kitchen">Kitchen</button>
        <button class="filter-btn" data-category="Carry">Carry</button>
      </div>
      <input type="search" id="searchInput" class="search-input" placeholder="Search products..." aria-label="Search products" />
    </div>

    <div class="product-grid" id="productGrid"></div>
  </main>

  <footer id="about">
    <p>&copy; 2026 Kibo Goods. Built as a lightweight, zero-dependency storefront template.</p>
  </footer>

  <!-- Shopping Cart Drawer -->
  <div class="drawer-backdrop" id="cartDrawer">
    <aside class="drawer" role="dialog" aria-label="Shopping Cart">
      <div class="drawer-header">
        <h2>Your Cart</h2>
        <button class="close-btn" id="closeCartBtn" aria-label="Close cart">&times;</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="drawer-footer">
        <div class="total-row">
          <span>Subtotal</span>
          <span id="cartTotal">$0.00</span>
        </div>
        <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
      </div>
    </aside>
  </div>

  <script>
    const PRODUCTS = [
      { id: 1, name: "Ceramic Pour-Over Dripper", category: "Kitchen", price: 34.00, icon: "☕", desc: "Ribbed stoneware cone for balanced single-cup extraction." },
      { id: 2, name: "Walnut Desk Organizer", category: "Workspace", price: 48.00, icon: "🪵", desc: "Solid oiled walnut tray for pens, notebooks, and daily carry." },
      { id: 3, name: "Waxed Canvas Tote", category: "Carry", price: 62.00, icon: "👜", desc: "Weather-resistant 16oz canvas bag with reinforced leather handles." },
      { id: 4, name: "Insulated Steel Tumbler", category: "Kitchen", price: 28.00, icon: "🥤", desc: "Double-wall vacuum insulation keeps drinks hot for 8 hours." },
      { id: 5, name: "Mechanical Task Lamp", category: "Workspace", price: 85.00, icon: "💡", desc: "Warm-dimming LED desk lamp with articulated brass arm." },
      { id: 6, name: "Recycled Nylon Tech Pouch", category: "Carry", price: 32.00, icon: "🎒", desc: "Origami-style internal dividers for chargers, cables, and SSDs." }
    ];

    let cart = JSON.parse(localStorage.getItem("kibo_cart") || "[]");
    let activeCategory = "all";
    let searchQuery = "";

    const productGrid = document.getElementById("productGrid");
    const cartCountEl = document.getElementById("cartCount");
    const cartItemsEl = document.getElementById("cartItems");
    const cartTotalEl = document.getElementById("cartTotal");
    const cartDrawer = document.getElementById("cartDrawer");

    function saveCart() {
      localStorage.setItem("kibo_cart", JSON.stringify(cart));
      renderCart();
    }

    function renderProducts() {
      const filtered = PRODUCTS.filter(p => {
        const matchesCategory = activeCategory === "all" || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              p.desc.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        productGrid.innerHTML = `<p style="color: var(--muted);">No products match your filter.</p>`;
        return;
      }

      productGrid.innerHTML = filtered.map(product => `
        <article class="card">
          <div class="card-thumb" aria-hidden="true">${product.icon}</div>
          <div class="card-body">
            <span class="card-category">${product.category}</span>
            <h3 class="card-title">${product.name}</h3>
            <p class="card-desc">${product.desc}</p>
            <div class="card-footer">
              <span class="price">$${product.price.toFixed(2)}</span>
              <button class="add-btn" onclick="addToCart(${product.id})">Add to Cart</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += 1;
      } else {
        const product = PRODUCTS.find(p => p.id === id);
        cart.push({ ...product, qty: 1 });
      }
      saveCart();
      cartDrawer.classList.add("open");
    }

    function updateQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      saveCart();
    }

    function renderCart() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + item.price * item.qty, 0);

      cartCountEl.textContent = totalQty;
      cartTotalEl.textContent = `$${totalPrice.toFixed(2)}`;

      if (cart.length === 0) {
        cartItemsEl.innerHTML = `<p style="color: var(--muted);">Your cart is currently empty.</p>`;
        return;
      }

      cartItemsEl.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <strong>${item.name}</strong>
            <div style="font-size: 0.85rem; color: var(--muted);">$${item.price.toFixed(2)} each</div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="updateQty(${item.id}, -1)" aria-label="Decrease quantity">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" onclick="updateQty(${item.id}, 1)" aria-label="Increase quantity">+</button>
          </div>
        </div>
      `).join("");
    }

    document.getElementById("categoryFilters").addEventListener("click", (e) => {
      if (!e.target.matches(".filter-btn")) return;
      document.querySelectorAll(".filter-btn").forEach(btn => btn.classList.remove("active"));
      e.target.classList.add("active");
      activeCategory = e.target.dataset.category;
      renderProducts();
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderProducts();
    });

    document.getElementById("openCartBtn").addEventListener("click", () => cartDrawer.classList.add("open"));
    document.getElementById("closeCartBtn").addEventListener("click", () => cartDrawer.classList.remove("open"));
    cartDrawer.addEventListener("click", (e) => {
      if (e.target === cartDrawer) cartDrawer.classList.remove("open");
    });

    document.getElementById("checkoutBtn").addEventListener("click", () => {
      if (cart.length === 0) {
        alert("Your cart is empty.");
        return;
      }
      alert("Thank you for your order! (Demo checkout complete)");
      cart = [];
      saveCart();
      cartDrawer.classList.remove("open");
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
